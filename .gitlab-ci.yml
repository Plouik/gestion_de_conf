stages:
  - deploy
  - cleanup

variables:
  TF_LOG_LEVEL: "info"

include: 
  - local: gitlab/deploy_review.yml
    rules:
      - if: '$CI_COMMIT_BRANCH != "master" && $CI_PIPELINE_SOURCE == "merge_request_event"'
  - local: gitlab/deploy_prod.yml
    rules:
      - if: '$CI_COMMIT_BRANCH == "master"'
