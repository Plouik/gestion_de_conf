stages:
  - build
  - deploy
  - review
  - cleanup

variables:
  port: 80
  SECURE_LOG_LEVEL: "info"

include: 
  - local: gitlab/deploy_review.yml
    variables:
      ENVIRONMENT: "dev"
      RESSOURCE_GROUP: "configuration-demo"
      REGISTRY: "omiomidemoomi.azurecr.io"
      IDENTITY: "myID"
    only:
      - branches
    except:
      - master
  - local: gitlab/deploy_prod.ym
    variables:
      ENVIRONMENT: "prod" 
      RESSOURCE_GROUP: "configuration-demo"
      REGISTRY: "omiomidemoomi.azurecr.io"
      IDENTITY: "myID"
    only:
      - master