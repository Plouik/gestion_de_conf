stages:
  - deploy
  - cleanup

variables:
  TF_LOG_LEVEL: "info"

workflow:
  rules:
    # Run pipelines for merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Also run for main branch pushes
    - if: '$CI_COMMIT_BRANCH == "master"'


include: 
  - local: gitlab/deploy_review.yml
    rules:
      - if: '$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME != "master"'
  - local: gitlab/deploy_prod.yml
    rules:
      - if: '$CI_COMMIT_BRANCH == "master"'
