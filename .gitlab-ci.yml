include:
  - component: $CI_SERVER_FQDN/components/opentofu/full-pipeline@4.9.0
    inputs:
      version: "4.9.0"
      opentofu_version: "1.12.6"
      state_name: "$TF_STATE_NAME"
      auto_define_backend: true
  - component: $CI_SERVER_FQDN/components/sast/iac-sast@3.5.0

stages: [validate, test, build, deploy, cleanup]

tf-tflint:
  image: ghcr.io/terraform-linters/tflint:v0.64.0
  stage: validate
  script:
    - tflint --init
    - tflint --recursive
  rules:
    - when: on_success

.environment-matrix:
  parallel: 
    matrix:
      - TF_STATE_NAME: "dev"
        TF_VAR_my_apps: '[{"ENVIRONMENT":"dev","port":7000}]'
      - TF_STATE_NAME: "prod"
        TF_VAR_my_apps: '[{"ENVIRONMENT":"prod","port":80}]'

plan:
  parallel: !reference [.environment-matrix, parallel]

apply:
  parallel: !reference [.environment-matrix, parallel]
  needs:
    - job: plan
      parallel:
        matrix:
          - TF_STATE_NAME: ['$[[ matrix.TF_STATE_NAME ]]']
  tags:
    - devcontainer

destroy:
  parallel: !reference [.environment-matrix, parallel]
  tags:
    - devcontainer



