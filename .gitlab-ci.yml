variables:
  TF_VAR_ENVIRONMENT: "PROD"

.terraform_init:
    - terraform init 

build:
  stage: build
  script: 
   - !reference [.terraform_init] 
   - terraform apply -auto-approve
  artifacts:
    paths: 
        - 'terraform.tfstate'

teardown:
  stage: .post
  script: 
   - !reference [.terraform_init] 
   - terraform destroy -auto-approve
  when: always