stages:
  - build
  - deploy
  - review
  - cleanup

variables:
  port: 80
  SECURE_LOG_LEVEL: "info"
  AZURE_CLIENT_ID: "cdaf2b56-c004-416d-9131-d0dad6d5a726"
  AZURE_TENANT_ID: "b7b023b8-7c32-4c02-92a6-c8cdaa1d189c"

include: 
  - local: gitlab/deploy_review.yml
    rules:
      - if: '$CI_COMMIT_BRANCH != "master"'
  - local: gitlab/deploy_prod.yml
    rules:
      - if: '$CI_COMMIT_BRANCH == "master"'
