include:
  - component: $CI_SERVER_FQDN/to-be-continuous/terraform/gitlab-ci-terraform@9.5.1
    inputs:
      review-enabled: true
      prod-enabled: true

.tf-workspace:
  parallel:
    matrix:
      - TF_ENVIRONMENT_NAMESPACE: "/dev"
        TF_VAR_my_apps: '[{"ENVIRONMENT":"dev","port":7000}]'
      - TF_ENVIRONMENT_NAMESPACE: "/prod"
        TF_VAR_my_apps: '[{"ENVIRONMENT":"prod","port":80}]'
