include:
  - component: $CI_SERVER_FQDN/components/sast/iac-sast@3.5.0
  - component: $CI_SERVER_FQDN/to-be-continuous/terraform/gitlab-ci-terraform@9.5.1
    inputs:
      review-enabled: true
      trivy-disabled: true

.tf-workspace:
  parallel:
    matrix:
      - TF_ENVIRONMENT_NAMESPACE: "/dev"
        TF_VAR_my_apps: '[{"ENVIRONMENT":"dev","port":7000}]' 
      - TF_ENVIRONMENT_NAMESPACE: "/prod"
        TF_VAR_my_apps: '[{"ENVIRONMENT":"prod","port":80}]'

.tf-create:
  tags:
    - devcontainer

.tf-destroy:
  tags:
    - devcontainer

tf-tflint:
  rules:
    - if: '$TF_TFLINT_DISABLED == "true"' 
      when: never
    - when: on_success
