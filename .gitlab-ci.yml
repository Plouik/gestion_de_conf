variables:
  TF_VAR_ENVIRONMENT: "PROD"
  TF_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_VAR_ENVIRONMENT}"


.terraform_init:
  - terraform init
    -backend-config="address=${TF_ADDRESS}"
    -backend-config="lock_address=${TF_ADDRESS}/lock"
    -backend-config="unlock_address=${TF_ADDRESS}/lock"
    -backend-config="username=gitlab-ci-token"
    -backend-config="password=${CI_JOB_TOKEN}"
    -backend-config="lock_method=POST"
    -backend-config="unlock_method=DELETE"

plan:
  stage: .pre
  script:
    - !reference [.terraform_init] 
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - tfplan
    expire_in: 1 week

apply:
  stage: build
  script:
    - !reference [.terraform_init] 
    - terraform apply -auto-approve tfplan
  dependencies:
    - plan
  when: manual
# build:
#   stage: build
#   script: 
#    - !reference [.terraform_init] 
#    - terraform apply -auto-approve

test:
  stage: test
  script: 
    - |
       output=$( curl http://localhost:80/ );
       echo "Testing that or server is running as $TF_VAR_ENVIRONMENT. Current value is $output";
       echo $output | grep -o "$TF_VAR_ENVIRONMENT";

teardown:
  stage: .post
  script: 
   - !reference [.terraform_init] 
   - terraform destroy -auto-approve
  when: always

