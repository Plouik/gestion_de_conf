variables:
  ENVIRONMENT: "prod" 
  RESSOURCE_GROUP: "configuration-demo"
  REGISTRY: "omiomidemoomi.azurecr.io"
  IDENTITY: "myID"
  IMAGE_TO_DEPLOY: "backend:${ENVIRONMENT}"

include: 
  local: gitlab/tf_vars.yml
  local: gitlab/deploy_app.yml
  
deploy-prod:
  extends: .act-on-change
  stage: deploy
  artifacts:
    reports:
      dotenv: envurl.env
  environment:
    name: production
    url: $DYNAMIC_ENVIRONMENT_URL
    on_stop: stop_prod

stop_prod:
  extends: .teardown
  needs:
    - deploy-prod
  stage: review
  environment:
    name: production
    action: stop
  allow_failure: true