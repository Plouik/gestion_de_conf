variables:
  ENVIRONMENT: "prod" 
  port: 80
  # RESSOURCE_GROUP: "configuration-demo"
  # REGISTRY: "omiomidemoomi.azurecr.io"
  # IDENTITY: "myID"
  # IMAGE_TO_DEPLOY: "backend:${ENVIRONMENT}"

# include: 
#   local: gitlab/deploy_app.yml
  
deploy-prod:
  trigger:
    include:
      - local: gitlab/deploy_app.yml
  # extends: .act-on-change
  stage: deploy
  environment:
    name: $ENVIRONMENT
    on_stop: stop_prod


stop_prod:
  trigger:
    include:
      - local: gitlab/destroy_app.yml
  when: manual
  variables:
    GIT_STRATEGY: none
  stage: cleanup
  environment:
    name: $ENVIRONMENT
    action: stop
  allow_failure: true