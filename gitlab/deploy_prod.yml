variables:
  ENVIRONMENT: "prod" 
  port: 80
  # RESSOURCE_GROUP: "configuration-demo"
  # REGISTRY: "omiomidemoomi.azurecr.io"
  # IDENTITY: "myID"
  # IMAGE_TO_DEPLOY: "backend:${ENVIRONMENT}"

# include: 
#   local: gitlab/deploy_app.yml
  
deploy-prod:
  trigger:
    include:
      - local: gitlab/deploy_app.yml
  # extends: .act-on-change
  stage: deploy
  environment:
    name: $ENVIRONMENT
    on_stop: stop_prod

stop_prod:
  script:
    - terraform destroy --auto-approve
  needs:
    - deploy-prod
  stage: review
  environment:
    name: production
    action: stop
  allow_failure: true