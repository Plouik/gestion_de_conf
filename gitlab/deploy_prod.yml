variables:
  TF_STATE_NAME: "${ENVIRONMENT}"
  TF_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
  TF_VAR_environment: ${ENVIRONMENT}
  TF_VAR_ressource_group: "${RESSOURCE_GROUP}"
  TF_VAR_registry: "${REGISTRY}"
  TF_VAR_image: "backend:${ENVIRONMENT}"
  TF_VAR_identity_username: "$IDENTITY"

include: 
  local: gitlab/deploy_app.yml
  

deploy-prod:
  extends: .act-on-change
  stage: deploy
  artifacts:
    reports:
      dotenv: envurl.env
  environment:
    name: production
    url: $DYNAMIC_ENVIRONMENT_URL
    on_stop: stop_prod

stop_prod:
  extends: .teardown
  needs:
    - deploy-prod
  stage: review
  environment:
    name: production
    action: stop
  allow_failure: true