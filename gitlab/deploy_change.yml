deploy-review:
  extends: .act-on-change
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: always
  variables:
    TF_VAR_my_apps: '[{Environment:"$CI_COMMIT_REF_SLUG",port:"$port"}]'
    TF_STATE_NAME: "${CI_COMMIT_REF_SLUG}"
    TF_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"  
  artifacts:
    reports:
      dotenv: envurl.env
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: $DYNAMIC_ENVIRONMENT_URL
    on_stop: stop_environment

stop_environment:
  extends: .teardown
  needs:
    - deploy-review
  stage: review
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: never
    - if: '$CI_COMMIT_BRANCH'
      when: manual
 
deploy-prod:
  extends: .act-on-change
  stage: deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: always
  variables:
    TF_VAR_my_apps: '[{Environment:"production",port:"$port"}]'
    TF_STATE_NAME: "production"
    TF_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"  
  artifacts:
    reports:
      dotenv: envurl.env
  environment:
    name: production
    url: $DYNAMIC_ENVIRONMENT_URL
    on_stop: stop_environment


.terraform_init:
    - terraform init
      -backend-config="address=${TF_ADDRESS}"
      -backend-config="lock_address=${TF_ADDRESS}/lock"
      -backend-config="unlock_address=${TF_ADDRESS}/lock"
      -backend-config="username=gitlab-ci-token"
      -backend-config="password=${CI_JOB_TOKEN}"
      -backend-config="lock_method=POST"
      -backend-config="unlock_method=DELETE"

.teardown:
  stage: cleanup
  script:
    - !reference [.terraform_init] 
    - terraform destroy --auto-approve

.act-on-change:
  script:
    - !reference [.terraform_init] 
    - |
      set +e
      terraform plan -detailed-exitcode --out main.tfplan
      CHECK_FOR_CHANGE=$?
      set -e
      if [ $CHECK_FOR_CHANGE -eq 2 ]; then
        terraform apply main.tfplan
        jq_filter=".[].$CI_COMMIT_REF_SLUG.ip_address"
        ENV_URL=$( terraform output -json ip_addresses | jq -r "$jq_filter" )
        echo "DYNAMIC_ENVIRONMENT_URL=${ENV_URL}" >> envurl.env
      else
        echo "Nothing to do."
      fi