.terraform_init:
  - terraform init
    -backend-config="address=${TF_ADDRESS}"
    -backend-config="lock_address=${TF_ADDRESS}/lock"
    -backend-config="unlock_address=${TF_ADDRESS}/lock"
    -backend-config="username=gitlab-ci-token"
    -backend-config="password=${CI_JOB_TOKEN}"
    -backend-config="lock_method=POST"
    -backend-config="unlock_method=DELETE"

.teardown:
  stage: cleanup
  script:
    - !reference [.terraform_init] 
    - terraform destroy --auto-approve

.build_and_push_docker:
  - docker build -t "$REGISTRY/$IMAGE_TO_DEPLOY" ./backend/
  - docker push "$REGISTRY/$IMAGE_TO_DEPLOY"

.azure_login:
  - az login --service-principal -u $AZURE_CLIENT_ID -t $AZURE_TENANT_ID --federated-token $GITLAB_OIDC_TOKEN
  - creds=$(az acr credential show --resource-group "$RESSOURCE_GROUP" --name "${REGISTRY%%.*}")
  - username=$( echo "$creds" | jq -r '.username' )
  - password=$( echo "$creds" | jq -r '.passwords[0].value' )
  - rm  /root/.docker/config.json #fix super moche 
  - docker login "$REGISTRY" --username "$username" --password "$password"

.act-on-change:
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://gitlab.com/Plouik/config
  script:
    - !reference [.azure_login]
    - !reference [.build_and_push_docker] 
    - !reference [.terraform_init] 
    - |
      set +e
      terraform plan -detailed-exitcode --out main.tfplan
      CHECK_FOR_CHANGE=$?
      set -e
      if [ $CHECK_FOR_CHANGE -eq 2 ]; then
        terraform apply main.tfplan
        ENV_URL=$( terraform output -raw "container_ipv4_address" )
        echo "DYNAMIC_ENVIRONMENT_URL=${ENV_URL}" >> envurl.env
      else
        echo "Nothing to do."
      fi