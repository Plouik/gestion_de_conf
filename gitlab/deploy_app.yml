include: 
  local: gitlab/terraform.yml   

terraform_check_for_changes:
  stage: .pre
  extends: terraform_report_changes
  artifacts:
    paths:
      - tfplan
    reports:
      terraform: plan.json
    reports:
      dotenv: changes.env


terraform_apply:
  stage: .deploy
  script:
    - !reference [.terraform_apply_changes] 
  needs:
    - job: terraform_check_for_changes
      artifacts: true
  rules:
    - if: $TERRAFORM_HAS_CHANGED == "true"
  artifacts:
    reports:
      dotenv: envurl.env
  environment:
    name: $UPSTREAM_ENVIRONMENT_NAME
    url: $DYNAMIC_ENVIRONMENT_URL
  

test:
  stage: test
  script: 
    - |
       output=$( curl http://localhost:$port/ );
       echo "Testing that or server is running as $ENVIRONMENT on port $port. Current value is $output";
       echo $output | grep -o "$ENVIRONMENT";