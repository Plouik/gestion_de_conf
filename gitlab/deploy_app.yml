variables:
  TF_VAR_my_apps: [ { "Environment": ${Environment}, port: ${port} } ]


.terraform_init:
    - terraform init 

build:
  stage: build
  script: 
   - !reference [.terraform_init] 
   - terraform apply -auto-approve

test:
  stage: test
  script: 
    - |
       output=$( curl http://localhost:80/ );
       echo "Testing that or server is running as $TF_VAR_ENVIRONMENT. Current value is $output";
       echo $output | grep -o "$TF_VAR_ENVIRONMENT";

teardown:
  stage: .post
  script: 
   - !reference [.terraform_init] 
   - terraform destroy -auto-approve
  when: always

