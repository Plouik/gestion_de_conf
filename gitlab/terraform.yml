variables:
  TF_STATE_NAME: "${ENVIRONMENT}"
  TF_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
  TF_VAR_my_apps: '[{ENVIRONMENT:"$ENVIRONMENT",port:"$port"}]'

terraform_check_for_changes:
  stage: .pre
  script:
    - !reference [.terraform_report_changes]
  artifacts:
    paths:
      - tfplan
    reports:
      terraform: plan.json
      dotenv: changes.env

terraform_apply:
  stage: build
  script:
    - !reference [.terraform_apply_changes] 
  needs:
    - job: terraform_check_for_changes
      artifacts: true
  artifacts:
    reports:
      dotenv: envurl.env
  environment:
    name: $UPSTREAM_ENVIRONMENT_NAME
    url: $DYNAMIC_ENVIRONMENT_URL
  

.terraform_init:
    - terraform init
      -backend-config="address=${TF_ADDRESS}"
      -backend-config="lock_address=${TF_ADDRESS}/lock"
      -backend-config="unlock_address=${TF_ADDRESS}/lock"
      -backend-config="username=gitlab-ci-token"
      -backend-config="password=${CI_JOB_TOKEN}"
      -backend-config="lock_method=POST"
      -backend-config="unlock_method=DELETE"

.terraform_report_changes:
  - !reference [.terraform_init] 
  - |
    set +e
    terraform plan -detailed-exitcode --out tfplan
    CHECK_FOR_CHANGE=$?
    set -e
    if [ $CHECK_FOR_CHANGE -eq 2 ]; then
      echo "TERRAFORM_HAS_CHANGED=true" > changes.env
      terraform show -json tfplan > plan.json
    fi

.terraform_apply_changes:
  - !reference [.terraform_init] 
  - |
    terraform apply --auto-approve 
    ENV_URL=$( terraform output -raw "webapp_url" )
    echo "DYNAMIC_ENVIRONMENT_URL=${ENV_URL}" > envurl.env
