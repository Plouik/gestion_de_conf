variables:
  ENVIRONMENT: "review/$CI_COMMIT_REF_SLUG"
  port: 7000

deploy-review:
  stage: deploy
  trigger:
    include:
      - local: gitlab/deploy_app.yml
    strategy: depend
  environment:
    name: $ENVIRONMENT
    on_stop: stop_review

stop_review:
  stage: cleanup
  trigger:
    include:
      - local: gitlab/destroy_app.yml
    strategy: depend
  environment:
    name: $ENVIRONMENT
    action: stop
  when: manual