variables:
  ENVIRONMENT: "$CI_COMMIT_REF_SLUG"
  RESSOURCE_GROUP: "configuration-demo"
  REGISTRY: "omiomidemoomi.azurecr.io"
  IDENTITY: "myID"
  IMAGE_TO_DEPLOY: "backend:${ENVIRONMENT}"

include: 
  local: gitlab/tf_vars.yml
  local: gitlab/deploy_app.yml

deploy-review:
  extends: .act-on-change
  stage: deploy
  artifacts:
    reports:
      dotenv: envurl.env
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: $DYNAMIC_ENVIRONMENT_URL
    on_stop: stop_review

stop_review:
  extends: .teardown
  needs:
    - deploy-review
  stage: review
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: manual
