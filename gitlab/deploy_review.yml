variables:
  ENVIRONMENT: "dev"
  RESSOURCE_GROUP: "configuration-demo"
  REGISTRY: "omiomidemoomi.azurecr.io"
  IDENTITY: "myID"
  IMAGE_TO_DEPLOY: "backend:${ENVIRONMENT}"
  TF_STATE_NAME: "${ENVIRONMENT}"
  TF_ADDRESS: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
  TF_VAR_environment: ${ENVIRONMENT}
  TF_VAR_ressource_group: "${RESSOURCE_GROUP}"
  TF_VAR_registry: "${REGISTRY}"
  TF_VAR_image: "$IMAGE_TO_DEPLOY"
  TF_VAR_identity_username: "$IDENTITY"  

include: 
  local: gitlab/deploy_app.yml

deploy-review:
  extends: .act-on-change
  stage: deploy
  artifacts:
    reports:
      dotenv: envurl.env
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    url: $DYNAMIC_ENVIRONMENT_URL
    on_stop: stop_review

stop_review:
  extends: .teardown
  needs:
    - deploy-review
  stage: review
  environment:
    name: review/$CI_COMMIT_REF_SLUG
    action: stop
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH'
      when: manual
